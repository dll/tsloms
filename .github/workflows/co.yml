name: CO - 生产持续运维巡检

on:
  schedule:
    # 每 10 分钟巡检一次
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}

# P1-03：CO 需要创建/关闭告警 issue，显式声明最小权限
permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: 健康巡检（API + 前端 + MQTT 端口）
    runs-on: ubuntu-latest
    steps:
      - name: 检查 API 健康
        id: api
        run: |
          BASE_URL="${DEPLOY_BASE_URL:-http://${DEPLOY_HOST}:8092}"
          if curl -fsS --max-time 15 "${BASE_URL}/tsloms/health"; then
            echo "api=ok"
          else
            echo "api=fail"
            exit 1
          fi

      - name: 检查前端可达
        run: |
          BASE_URL="${DEPLOY_BASE_URL:-http://${DEPLOY_HOST}:8092}"
          curl -fsS --max-time 15 -o /dev/null "${BASE_URL}/tsloms/admin/" || exit 1

      - name: 检查 MQTT 端口
        run: |
          (echo > /dev/tcp/${{ env.DEPLOY_HOST }}/1883) 2>/dev/null || { echo "MQTT 1883 端口不可达"; exit 1; }

      - name: 巡检失败 - 创建/去重告警 issue
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const TITLE = '[告警] 生产环境巡检失败';
            const LABEL = 'prod-incident';
            // P1-05：按标签 + 分页去重，避免默认第一页漏查
            let exists = null;
            for (let p = 1; ; p++) {
              const { data } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: LABEL,
                per_page: 100,
                page: p,
              });
              if (!data.length) break;
              const hit = data.find(i => i.title === TITLE);
              if (hit) { exists = hit; break; }
            }
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                labels: [LABEL],
                body: `生产环境巡检失败：\n- 时间：${new Date().toISOString()}\n- 主机：${{ env.DEPLOY_HOST }}\n\n请检查服务状态：\n\`ssh root@${{ env.DEPLOY_HOST }}\` 后执行 \`systemctl status tsloms-server\` 和 \`journalctl -u tsloms-server -n 50\`。`,
              });
            }

      - name: 巡检恢复 - 关闭旧告警 issue
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const TITLE = '[告警] 生产环境巡检失败';
            const LABEL = 'prod-incident';
            for (let p = 1; ; p++) {
              const { data } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: LABEL,
                per_page: 100,
                page: p,
              });
              if (!data.length) break;
              for (const it of data) {
                if (it.title !== TITLE) continue;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: it.number,
                  body: `巡检已恢复：${new Date().toISOString()}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: it.number,
                  state: 'closed',
                });
              }
            }

  deep-probe:
    name: 深度巡检（DB/Redis/备份/主机/MQTT 认证）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 生成探针脚本 base64
        id: probe
        shell: bash
        run: |
          echo "PROBE_B64=$(base64 -w0 deploy/scripts/probe-deep.sh)" >> "$GITHUB_ENV"

      - name: 服务器本机深度探针
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: 22
          script: |
            set -e
            echo "${{ env.PROBE_B64 }}" | base64 -d > /tmp/probe-deep.sh
            chmod +x /tmp/probe-deep.sh
            bash /tmp/probe-deep.sh || exit 1
            rm -f /tmp/probe-deep.sh
