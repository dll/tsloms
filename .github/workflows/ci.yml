name: CI - Go 质量门（含覆盖率门禁 ≥80%）

# CI-P1-03：E2E 冒烟（health/登录/仪表盘/读接口）不在 CI 阶段执行，因 CI 尚未部署、无运行中的服务；
#           由部署后的 e2e.yml 通过 CD 成功 workflow_run 触发，并支持受保护环境 + SSH 本机冒烟。
#           此处不重复执行，避免对未部署端点误判。
on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/admin/**'
      - 'deploy/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
      - '.github/workflows/e2e.yml'
      - '.tool-versions'
  pull_request:
    paths:
      - 'packages/server/**'
      - 'packages/admin/**'
      - 'deploy/**'
      - '.github/workflows/ci.yml'
      - '.tool-versions'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: 覆盖率 ≥80% + gofmt/vet/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # gitleaks 需要完整 git 历史扫描泄漏（浅克隆 fetch-depth:1 会失败）
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: packages/server/go.sum

      - name: 安装 Go 依赖（GOPROXY 国内镜像）
        run: |
          go env -w GOPROXY="https://goproxy.cn,direct"
          go mod download

      - name: 校验 Go 版本（须为 1.26.x）
        run: |
          go version
          test "$(go version | grep -oE 'go[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)" = "go1.26.6" \
            || { echo "ERROR: Go 版本必须为 1.26.6" >&2; exit 1; }

      - name: gofmt 检查（应为 0 文件）
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: 0 文件需格式化 ✅"

      - name: go vet
        run: go vet ./...

      - name: Go 依赖漏洞扫描（govulncheck，CI-P1-02）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... 2>&1 | tee govulncheck.out
          # govulncheck 在发现漏洞时返回非 0，天然阻断；无漏洞则退出 0

      - name: 密钥泄漏扫描（gitleaks，CI-P1-02）
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .gitleaks.toml

      - name: go build
        run: go build ./...

      - name: go test 全量
        run: go test ./... -count=1

      - name: 覆盖率门禁（合并全包浮点比较，低于 80% 失败）
        run: |
          go test ./... -count=1 -covermode=set -coverpkg=./... -coverprofile=coverage.out
          TOTAL=$(go run ./cmd/coveragecheck -threshold 80 -profile coverage.out 2>&1 | tee /dev/stderr | grep -oE '[0-9]+\.[0-9]+%' | head -1)
          echo "## 覆盖率门禁结果：$TOTAL（阈值 80%）" >> "$GITHUB_STEP_SUMMARY"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-coverage-report
          path: packages/server/coverage.out
          if-no-files-found: ignore

  admin-quality-gate:
    name: 前端 lint + 单测 + 构建 + 依赖审计
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: ESLint 与类型检查
        run: npm run lint

      - name: 前端单元测试
        run: npm run test

      - name: 前端生产构建
        run: npm run build

      - name: 前端依赖漏洞审计
        run: npm audit --omit=dev --audit-level=high

  package:
    name: 构建不可变制品（server + admin dist + manifest）
    needs: [quality-gate, admin-quality-gate]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      release-sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - id: sha
        shell: bash
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: packages/server/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json

      - name: 构建后端（Linux/amd64，不可变制品）
        working-directory: packages/server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go env -w GOPROXY="https://goproxy.cn,direct"
          go mod download
          mkdir -p ../../release
          go build -trimpath -ldflags "-s -w" -o ../../release/server ./cmd/server

      - name: 构建前端 dist
        working-directory: packages/admin
        run: |
          npm ci
          npm run build
          mkdir -p ../../release/admin
          cp -r dist ../../release/admin/dist

      - name: 编排制品清单、SBOM 与校验
        run: |
          mkdir -p release
          # 发布脚本由 CD 单独上传到服务器固定 /opt/tsloms/bin/，不打包进制品
          # （避免与服务器端脚本版本漂移）。制品只含不可变二进制与前端。
          echo "${GITHUB_SHA}" > release/version.txt
          # 轻量 SBOM（CI-P1-02）：记录后端模块与前端依赖清单，供供应链审计
          ( cd packages/server && go list -m all > ../../release/deps-go.sbom.txt )
          ( cd packages/admin && cp package-lock.json ../../release/deps-npm.lock.json )
          ( cd release && find server admin -type f -print0 | sort -z | xargs -0 sha256sum > manifest.sha256 )
          # 将 SBOM 也纳入完整性清单
          ( cd release && sha256sum deps-go.sbom.txt deps-npm.lock.json version.txt >> manifest.sha256 )
          echo "== 制品清单 =="
          ls -la release
          ( cd release && cat manifest.sha256 )

      - name: 上传制品（tsloms-release）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tsloms-release
          path: release/
          if-no-files-found: error
          retention-days: 7
