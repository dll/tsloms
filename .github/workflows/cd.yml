name: CD - 生产自动部署

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'deploy/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_APP_DIR: /opt/tsloms

jobs:
  deploy:
    name: 构建并部署到生产
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 前端构建 ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json

      - name: 构建管理后台
        working-directory: packages/admin
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci
          npm run build

      # ---------- 后端构建 ----------
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/server/go.mod
          cache: true

      - name: 构建服务端（linux/amd64）
        working-directory: packages/server
        run: |
          go env -w GOPROXY="https://goproxy.cn,direct"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server cmd/server/main.go

      # ---------- 上传与部署 ----------
      - name: 打包构建产物
        run: |
          mkdir -p deploy/stage
          tar czf deploy/stage/dist.tar.gz -C packages/admin dist
          tar czf deploy/stage/server.tar.gz -C packages/server server
          ls -lh deploy/stage/

      - name: 上传产物（scp）
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deploy/stage/dist.tar.gz deploy/stage/server.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/tsloms/deploy/stage/

      - name: 备份当前版本（SSH）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          insecure: true
          script: |
            set -e
            APP=${{ env.DEPLOY_APP_DIR }}
            ADMIN=$APP/packages/admin
            SERVER=$APP/packages/server
            TMP=$APP/deploy/stage
            mkdir -p $TMP
            TS=$(date +%Y%m%d%H%M%S)
            mkdir -p $APP/deploy/backups
            cp -r $ADMIN/dist $APP/deploy/backups/dist-$TS 2>/dev/null || true
            cp $SERVER/server $APP/deploy/backups/server-$TS 2>/dev/null || true
            echo "backup done: $TS"

      - name: 解压并替换、重启（SSH）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          insecure: true
          script: |
            set -e
            APP=${{ env.DEPLOY_APP_DIR }}
            TMP=$APP/deploy/stage
            ADMIN=$APP/packages/admin
            SERVER=$APP/packages/server

            # 解压
            tar xzf $TMP/dist.tar.gz -C $TMP
            tar xzf $TMP/server.tar.gz -C $TMP
            ls -lh $TMP/ | head

            # 替换前端（先清空再拷入，避免残留旧 chunk）
            rm -rf $ADMIN/dist
            mv $TMP/dist $ADMIN/dist
            chown -R tsloms:tsloms $ADMIN/dist 2>/dev/null || true

            # 替换后端二进制
            chmod +x $TMP/server
            mv $TMP/server $SERVER/server
            chown tsloms:tsloms $SERVER/server 2>/dev/null || true

            # 清理暂存
            rm -rf $TMP

            # 重启并验证
            systemctl restart tsloms-server
            sleep 4
            systemctl is-active tsloms-server

      - name: 健康检查（生产 API）
        run: |
          sleep 3
          curl -fsS "http://${{ env.DEPLOY_HOST }}:8092/tsloms/health" || exit 1
          curl -fsS -o /dev/null "http://${{ env.DEPLOY_HOST }}:8092/tsloms/admin/" || exit 1
          echo "部署完成，前端与 API 均正常"