name: CD - 生产制品化部署

# workflow_run：仅当 CI（.github/workflows/ci.yml）成功完成后触发，
# 保证所部署的 commit SHA 已通过全部质量门（P0-03：CD 严格依赖 CI）。
#
# 关键约束：
#   - workflow_run 工作流无法直接读取 repository secrets（除 GITHUB_TOKEN），
#     生产 SSH 密钥、主机等必须放在 GitHub Environment "production" 的 secrets 中，
#     本工作流通过 environment: production 引用（environment 级 secrets 在 workflow_run 可用）。
#   - 制品由 ci.yml 的 package job 构建并上传（不可变、带 SHA），CD 只负责传输+切换，
#     服务器不执行任何编译/构建（P0-02 / P1-09）。
on:
  workflow_run:
    workflows: ['CI - Go 质量门（含覆盖率门禁 ≥80%）']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: '手动指定部署的 commit SHA（默认当前 main HEAD）'
        required: false
        default: ''

env:
  DEPLOY_APP_DIR: /opt/tsloms

# P1-01：同一时间仅允许一个生产部署，且不取消进行中的部署
concurrency:
  group: tsloms-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: 上传制品并原子切换生产
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 解析目标 commit SHA
        id: sha
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.sha }}" ]; then
              SHA="${{ github.event.inputs.sha }}"
            else
              SHA="${{ github.sha }}"
            fi
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          SHA="${SHA//$'\r'/}"
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: RELEASE_SHA 必须为 40 位小写十六进制 SHA" >&2
            exit 1
          fi
          echo "RELEASE_SHA=${SHA}" >> "$GITHUB_OUTPUT"
          echo "解析部署 SHA: ${SHA}"

      - name: 检出目标提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.sha.outputs.RELEASE_SHA }}

      - name: 定位 CI 制品的 run_id
        id: runid
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            SHA="${{ steps.sha.outputs.RELEASE_SHA }}"
            # CD-P1-03 / HIGH-6：手动部署必须找到目标 SHA 对应的成功 CI run，不做“最新成功”替代；
            # 且必须精确定位产出 tsloms-release 制品的主 CI（.github/workflows/ci.yml，名为
            # “CI - Go 质量门（含覆盖率门禁 ≥80%）”），绝不用 startswith("CI") 去匹配，
            # 否则会命中同样以 CI 开头的 ci-admin.yml（其 run 不产出制品）。
            RUN_ID=$(gh run list \
              --workflow "CI - Go 质量门（含覆盖率门禁 ≥80%）" \
              --commit "${SHA}" \
              --json databaseId,status,conclusion \
              --limit 30 \
              --jq '[.[] | select(.status == "completed") | select(.conclusion == "success")] | .[0].databaseId')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "ERROR: 未找到目标 SHA=${SHA} 的成功 CI(-Go质量门) 运行，拒绝部署" >&2
              exit 1
            fi
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: 无法定位 CI 制品的 run_id" >&2
            exit 1
          fi
          echo "CI_RUN_ID=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "CI 运行 ID: ${RUN_ID}"

      - name: 下载 CI 构建制品（server / admin dist / manifest / version）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tsloms-release
          path: ./release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runid.outputs.CI_RUN_ID }}

      - name: 校验制品完整性
        shell: bash
        run: |
          set -e
          # actions/download-artifact 在不同版本/参数下可能多包一层目录；
          # 以 manifest.sha256 的实际位置作为制品根，禁止因目录层级误判为坏包。
          SRC="$(find ./release -type f -path '*/server' -printf '%h\n' | head -1)"
          if [ -z "$SRC" ]; then
            SRC="$(find ./release -type f -name version.txt -printf '%h\n' | head -1)"
          fi
          if [ -z "$SRC" ]; then
            echo "ERROR: 下载制品中找不到 server/version.txt，完整目录如下：" >&2
            find ./release -maxdepth 8 -print >&2 || true
            exit 1
          fi
          echo "RELEASE_ROOT=$SRC" >> "$GITHUB_ENV"
          echo "制品根目录：$SRC"
          echo "制品内容："
          find "$SRC" -maxdepth 3 -type f -print | sort
          # 个别旧制品未携带清单时重建清单；重建后仍执行 sha256sum -c。
          if [ ! -f "$SRC/manifest.sha256" ]; then
            echo "WARN: 制品缺少 manifest.sha256，按制品文件重建"
            ( cd "$SRC" && find server admin -type f -print0 | sort -z | xargs -0 sha256sum > manifest.sha256 )
            for f in deps-go.sbom.txt deps-npm.lock.json version.txt; do
              if [ -f "$SRC/$f" ]; then sha256sum "$SRC/$f" | sed "s#${SRC}/##" >> "$SRC/manifest.sha256"; fi
            done
          fi
          for f in server admin/dist/index.html manifest.sha256 version.txt; do
            if [ ! -f "$SRC/$f" ]; then
              echo "ERROR: 缺少制品文件 $f" >&2
              exit 1
            fi
          done
          # 兼容版本清单改造前的历史 CI 制品：缺失时按目标 SHA 补齐；已有清单则必须严格匹配。
          if [ ! -f "$SRC/admin/dist/version.json" ]; then
            echo "WARN: 历史制品缺少 version.json，按目标 SHA 补生成"
            jq -n --arg sha "${{ steps.sha.outputs.RELEASE_SHA }}" \
              '{version:"legacy",commit:$sha,build:"legacy",built_at:(now|todateiso8601)}' \
              > "$SRC/admin/dist/version.json"
            sha256sum "$SRC/admin/dist/version.json" | sed "s#${SRC}/##" >> "$SRC/manifest.sha256"
          else
            echo "前端版本清单："
            cat "$SRC/admin/dist/version.json"
            jq -e --arg sha "${{ steps.sha.outputs.RELEASE_SHA }}" '.commit == $sha' "$SRC/admin/dist/version.json" >/dev/null \
              || { echo "ERROR: 制品 version.json 的 commit 与目标 SHA 不一致" >&2; exit 1; }
          fi
          if [ -f "$SRC/version.txt" ]; then
            test "$(tr -d '\r\n' < "$SRC/version.txt")" = "${{ steps.sha.outputs.RELEASE_SHA }}" \
              || { echo "ERROR: 制品 version.txt 与目标 SHA 不一致" >&2; exit 1; }
          fi
          if [ -f "$SRC/manifest.sha256" ]; then
            ( cd "$SRC" && sha256sum -c manifest.sha256 ) || { echo "ERROR: 制品 SHA-256 校验失败" >&2; exit 1; }
          fi
          echo "制品校验通过"

      - name: 流式上传制品到服务器暂存目录（sha-staging）
        # 用 tar + ssh 流式传输，避免逐文件 scp 半成品；服务器只做落位与切换。
        # 发布脚本固定放置于 /opt/tsloms/bin/release-install.sh（不随 release 滚动）。
        shell: bash
        run: |
          set -e
          SHA="${{ steps.sha.outputs.RELEASE_SHA }}"
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          HOST="${{ secrets.DEPLOY_HOST }}"
          USER="${{ secrets.DEPLOY_USER }}"
          ROOT="${{ env.DEPLOY_APP_DIR }}"
          # CD-P1-04：固定 SSH host fingerprint，禁止 StrictHostKeyChecking=no
          FINGERPRINT="${{ secrets.DEPLOY_HOST_FINGERPRINT }}"
          KNOWN_HOSTS="${RUNNER_TEMP}/known_hosts"
          SCANNED_HOSTS="${RUNNER_TEMP}/scanned_hosts"
          # DEPLOY_HOST_FINGERPRINT 是 SHA256 摘要，不是 known_hosts 公钥行；
          # 先扫描完整 ED25519 公钥，再计算摘要比对后写入 known_hosts。
          ssh-keyscan -T 15 -t ed25519 "${HOST}" > "${SCANNED_HOSTS}" 2>/dev/null
          if [ ! -s "${SCANNED_HOSTS}" ]; then
            echo "ERROR: 无法获取 ${HOST} 的 ED25519 主机公钥" >&2
            exit 1
          fi
          ACTUAL_FINGERPRINT=$(ssh-keygen -lf "${SCANNED_HOSTS}" -E sha256 | awk 'NR==1{print $2}')
          if [ -z "${ACTUAL_FINGERPRINT}" ] || [ "${ACTUAL_FINGERPRINT}" != "${FINGERPRINT}" ]; then
            echo "ERROR: 主机指纹不匹配" >&2
            echo "期望: ${FINGERPRINT}" >&2
            echo "实际: ${ACTUAL_FINGERPRINT:-<空>}" >&2
            exit 1
          fi
          cp "${SCANNED_HOSTS}" "${KNOWN_HOSTS}"

          SSHOPTS=(-i "$KEY_FILE" -o UserKnownHostsFile="$KNOWN_HOSTS" -o StrictHostKeyChecking=yes -o ConnectTimeout=20)

          # SSH 诊断预检：在远程发布脚本前单独验证密钥、用户、主机和指纹。
          ssh "${SSHOPTS[@]}" "${USER}@${HOST}" "echo TSLOMS_SSH_AUTH_OK"

          # 1) 创建 releases / bin 目录并放置发布脚本（固定路径，幂等）
          ssh "${SSHOPTS[@]}" "${USER}@${HOST}" \
            "mkdir -p ${ROOT}/releases ${ROOT}/bin && cat > ${ROOT}/bin/release-install.sh" < deploy/scripts/release-install.sh
          ssh "${SSHOPTS[@]}" "${USER}@${HOST}" "chmod +x ${ROOT}/bin/release-install.sh"
          # 首次引导脚本（手动执行，用于平滑迁移现役版本到制品化结构）
          ssh "${SSHOPTS[@]}" "${USER}@${HOST}" \
            "cat > ${ROOT}/bin/bootstrap-artifacts.sh" < deploy/scripts/bootstrap-artifacts.sh
          ssh "${SSHOPTS[@]}" "${USER}@${HOST}" "chmod +x ${ROOT}/bin/bootstrap-artifacts.sh"

          # 2) 清理并重建 staging 目录（保持 .staging 态，校验通过前不落位）
          ssh "${SSHOPTS[@]}" "${USER}@${HOST}" \
            "rm -rf ${ROOT}/releases/${SHA}.staging && mkdir -p ${ROOT}/releases/${SHA}.staging/admin"

          # 3) 流式上传制品（保持相对路径：admin/ server manifest.sha256 version.txt + SBOM）
          UPLOAD_ROOT="${RELEASE_ROOT:-./release}"
          UPLOAD_FILES=(admin server manifest.sha256 version.txt)
          for optional in deps-go.sbom.txt deps-npm.lock.json; do
            if [ -f "${UPLOAD_ROOT}/${optional}" ]; then UPLOAD_FILES+=("${optional}"); fi
          done
          echo "上传文件：${UPLOAD_FILES[*]}"
          tar -C "${UPLOAD_ROOT}" -czf - "${UPLOAD_FILES[@]}" \
            | ssh "${SSHOPTS[@]}" "${USER}@${HOST}" \
              "cat > /tmp/tsloms-${SHA}.tgz && tar -xzf /tmp/tsloms-${SHA}.tgz -C ${ROOT}/releases/${SHA}.staging && rm -f /tmp/tsloms-${SHA}.tgz"

          echo "制品已上传到 ${ROOT}/releases/${SHA}.staging"

      - name: 执行原子切换 + 迁移备份 + 探活回滚（服务器端脚本）
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: 22
          # CD-P1-04：固定 SSH host fingerprint，防中间人
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          timeout: 180s
          script: |
            set -e
            # 服务器端发布脚本固定路径，入参为 release SHA
            RELEASE_SHA=${{ steps.sha.outputs.RELEASE_SHA }} \
            bash ${{ env.DEPLOY_APP_DIR }}/bin/release-install.sh

      - name: 生产入口健康检查（HTTPS + 后台 index）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: |
          BASE_URL="${DEPLOY_BASE_URL:-http://${DEPLOY_HOST}:8092}"
          curl -fsS --max-time 20 "${BASE_URL}/tsloms/health" || exit 1
          curl -fsS --max-time 20 -o /dev/null "${BASE_URL}/tsloms/admin/" || exit 1
          VERSION_JSON=$(curl -fsS --max-time 20 "${BASE_URL}/tsloms/admin/version.json?probe=${{ steps.sha.outputs.RELEASE_SHA }}")
          echo "生产前端版本：${VERSION_JSON}"
          echo "$VERSION_JSON" | jq -e --arg sha "${{ steps.sha.outputs.RELEASE_SHA }}" '.commit == $sha' >/dev/null \
            || { echo "ERROR: 生产前端版本与部署 SHA 不一致，拒绝判定部署成功" >&2; exit 1; }
          echo "部署完成，前端与 API 均正常"
