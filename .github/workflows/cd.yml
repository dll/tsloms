name: CD - 生产自动部署

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'deploy/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_APP_DIR: /opt/tsloms

concurrency:
  # 同一时间只允许一个生产部署，避免并发写同一目录（P1-01）
  group: tsloms-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 构建并部署到生产
    runs-on: ubuntu-latest
    steps:
      - name: 拉取最新代码并在服务器构建部署（SSH）
        # P1-02：固定第三方 action 完整 commit SHA，避免可变 tag 漂移；移除不安全的宽加密选项
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            APP=${{ env.DEPLOY_APP_DIR }}
            cd $APP

            echo "=== 1. 备份当前版本 ==="
            TS=$(date +%Y%m%d%H%M%S)
            mkdir -p $APP/deploy/backups
            cp -r packages/admin/dist $APP/deploy/backups/dist-$TS 2>/dev/null || true
            cp packages/server/server $APP/deploy/backups/server-$TS 2>/dev/null || true
            echo "backup done: $TS"

            echo "=== 2. 拉取最新代码 ==="
            GIT_TERMINAL_PROMPT=0 git pull origin main

            echo "=== 3. 构建服务端 ==="
            cd packages/server
            go env -w GOPROXY="https://goproxy.cn,direct"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server cmd/server/main.go

            echo "=== 4. 构建管理后台 ==="
            cd ../admin
            npm config set registry https://registry.npmmirror.com
            npm ci
            npm run build

            echo "=== 5. 修正属主 ==="
            chown -R tsloms:tsloms $APP/packages/admin/dist 2>/dev/null || true
            chown tsloms:tsloms $APP/packages/server/server 2>/dev/null || true

            echo "=== 6. 重启服务 ==="
            systemctl restart tsloms-server
            sleep 5
            systemctl is-active tsloms-server

      - name: 健康检查（生产 API）
        run: |
          curl -fsS --max-time 20 "http://${{ env.DEPLOY_HOST }}:8092/tsloms/health" || exit 1
          curl -fsS --max-time 20 -o /dev/null "http://${{ env.DEPLOY_HOST }}:8092/tsloms/admin/" || exit 1
          echo "部署完成，前端与 API 均正常"