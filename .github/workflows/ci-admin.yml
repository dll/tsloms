name: CI - Admin 前端质量门

on:
  push:
    paths:
      - 'packages/admin/**'
  pull_request:
    paths:
      - 'packages/admin/**'
  workflow_dispatch:

jobs:
  admin-quality-gate:
    name: lint + 单测 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json

      - name: 安装依赖（国内镜像加速）
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci

      - name: ESLint + 类型检查
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npm run build