name: CI - Admin 前端质量门

on:
  push:
    paths:
      - 'packages/admin/**'
      - '.github/workflows/ci-admin.yml'
      - '.node-version'
  pull_request:
    paths:
      - 'packages/admin/**'
      - '.github/workflows/ci-admin.yml'
      - '.node-version'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-quality-gate:
    name: lint + 单测 + 构建 + 依赖审计
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/admin/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: ESLint + 类型检查
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npm run build

      - name: 依赖漏洞审计（高危及阻断）
        run: npm audit --omit=dev --audit-level=high
