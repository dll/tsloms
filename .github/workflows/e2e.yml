name: E2E - 生产端到端冒烟（CI-P1-03）

# CI-P1-03：将 E2E 冒烟接入流水线。
# 触发时机：
#   - workflow_run：CD（生产部署）成功后自动执行，验证刚上线版本的 health/登录/仪表盘/只读接口。
#   - workflow_dispatch：可对指定 SHA / 环境手动触发（如发布后补测、巡检）。
#
# 限制与说明：
#   - CI runner 是无浏览器沙箱，本工作流不跑 UI 自动化；只做 HTTP 层最小冒烟
#     （health / 登录 / dashboard / 只读业务接口），符合“最小冒烟”验收口径。
#   - 凭据一律来自 GitHub Environment Secret（production，工作流级不经环境引不到），
#     在声明了 environment 的 job 内经 env 注入，不写入脚本/命令行/日志；脚本已脱敏。
#   - E2E 访问入口两种：
#       A) E2E_BASE_URL / DEPLOY_BASE_URL 指向外部（HTTPS/反向代理）入口，直接跑 node 脚本；
#       B) 受保护环境 + SSH 调服务器本机冒烟（deploy/scripts/smoke-local.sh，127.0.0.1:8093），
#          避免暴露测试入口，仅依赖既有 SSH Secret。
on:
  workflow_run:
    workflows: ['CD - 生产制品化部署']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tsloms-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-http:
    name: HTTP 层端到端冒烟（外部/测试入口）
    runs-on: ubuntu-latest
    environment: production
    # 环境级 secrets 仅在声明 environment 的 job 内可用；workflow 顶层 env 不可见。
    env:
      E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
      E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 决定 E2E 目标地址
        id: target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        shell: bash
        run: |
          DEFAULT_BASE="http://${DEPLOY_HOST}:8092/tsloms/api/v1"
          BASE="${E2E_BASE_URL:-${DEPLOY_BASE_URL:-${DEFAULT_BASE}}}"
          BASE="${BASE%/}"
          # 生产 8092 当前由 HTTP Nginx 提供；若历史 Secret 误填 https://host:8092，
          # 仅在 HTTPS 探测失败且 HTTP 探测成功时自动回退，不改变用户明确配置的其它地址。
          if [[ "${BASE}" =~ ^https://[^/]+:8092(/.*)?$ ]]; then
            HTTP_BASE="http://${BASE#https://}"
            if ! curl -fsS --max-time 10 "${BASE}/health" >/dev/null 2>&1 && \
               curl -fsS --max-time 10 "${HTTP_BASE}/health" >/dev/null 2>&1; then
              BASE="${HTTP_BASE}"
            fi
          fi
          echo "TARGET=${BASE}" >> "$GITHUB_OUTPUT"
          # 不打印完整 URL 或任何凭据，仅打印协议和主机用于审计。
          SCHEME="${BASE%%://*}"
          echo "E2E 目标协议: ${SCHEME}; 主机: ${DEPLOY_HOST}"

      # smoke.js 只用 Node 原生 fetch，无需 npm install；Node ≥18 自带全局 fetch。
      - name: 执行 E2E 冒烟（node e2e/smoke.js）
        working-directory: packages/admin
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.TARGET }}
        # 密码只经 env 注入（job 级 env），脚本内部脱敏，不进入命令行 argv。
        run: node e2e/smoke.js

  e2e-ssh-local:
    name: 服务器本机 E2E 冒烟（受保护环境 + SSH）
    runs-on: ubuntu-latest
    environment: production
    # 凭据仅在运行时注入远端探针，不写入仓库或日志。
    env:
      E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
      E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 准备原生 SSH 严格主机校验
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="${RUNNER_TEMP}/deploy_key"
          SCANNED_HOSTS="${RUNNER_TEMP}/scanned_hosts"
          KNOWN_HOSTS="${RUNNER_TEMP}/known_hosts"
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -T 15 -t ed25519 "${{ secrets.DEPLOY_HOST }}" > "${SCANNED_HOSTS}" 2>/dev/null
          test -s "${SCANNED_HOSTS}"
          ACTUAL_FINGERPRINT=$(ssh-keygen -lf "${SCANNED_HOSTS}" -E sha256 | awk 'NR==1{print $2}')
          EXPECTED_FINGERPRINT="${{ secrets.DEPLOY_HOST_FINGERPRINT }}"
          test -n "${EXPECTED_FINGERPRINT}" && test "${ACTUAL_FINGERPRINT}" = "${EXPECTED_FINGERPRINT}" \
            || { echo "ERROR: SSH 主机指纹不匹配（期望 ${EXPECTED_FINGERPRINT}，实际 ${ACTUAL_FINGERPRINT}）" >&2; exit 1; }
          cp "${SCANNED_HOSTS}" "${KNOWN_HOSTS}"

      - name: SSH 调用服务器本机冒烟
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="${RUNNER_TEMP}/deploy_key"
          KNOWN_HOSTS="${RUNNER_TEMP}/known_hosts"
          USER="${{ secrets.DEPLOY_USER }}"
          HOST="${{ secrets.DEPLOY_HOST }}"
          SSHOPTS=(-i "${KEY_FILE}" -o UserKnownHostsFile="${KNOWN_HOSTS}" -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          USER_B64=$(printf '%s' "${E2E_ADMIN_USER}" | base64 -w0)
          PASS_B64=$(printf '%s' "${E2E_ADMIN_PASS}" | base64 -w0)
          {
            printf 'E2E_ADMIN_USER_B64=%s\n' "${USER_B64}"
            printf 'E2E_ADMIN_PASS_B64=%s\n' "${PASS_B64}"
            printf '%s\n' 'export E2E_ADMIN_USER="$(printf "%s" "$E2E_ADMIN_USER_B64" | base64 -d)"'
            printf '%s\n' 'export E2E_ADMIN_PASS="$(printf "%s" "$E2E_ADMIN_PASS_B64" | base64 -d)"'
            cat deploy/scripts/smoke-local.sh
          } | ssh "${SSHOPTS[@]}" "${USER}@${HOST}" 'bash -s'
