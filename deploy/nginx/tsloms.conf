server {
    listen 8092;
    server_name _;

    client_max_body_size 50m;

    # 禁止绝对重定向（避免在Caddy/网关反向代理后暴露内部端口8092）
    absolute_redirect off;
    port_in_redirect off;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 统一 UTF-8 编码（避免中文乱码）
    charset utf-8;

    # ------------------------------------------------------------------
    # 统一路径前缀 /tsloms
    # 前端已编译为 base='/tsloms/admin/'，API 请求为 /tsloms/api/v1/...，
    # 401 跳转地址为 /tsloms/admin/login。故本 server 仅接受 /tsloms 前缀请求。
    # 网关（Caddy）应将 /tsloms 前缀原样转发到本机 8092（不剥离前缀）。
    # ------------------------------------------------------------------

    # 根路径重定向到管理后台
    location = / {
        return 302 /tsloms/admin/;
    }

    # 管理后台（history 路由，try_files 回退 index.html）
    # 制品化：前端 dist 位于 current 符号链接下（releases/<sha>/admin/dist）
    location /tsloms/admin {
        alias /opt/tsloms/current/admin/dist/;
        index index.html;
        try_files $uri $uri/ @tsloms_spa;
    }
    # SPA history 路由兜底：直连/刷新深层路由时回退 index.html（避免 alias+try_files 重定向循环/500）
    location @tsloms_spa {
        root /opt/tsloms/current/admin;
        try_files /dist/index.html =404;
    }

    # API 代理：剥离 /tsloms 前缀后转发到后端（后端只认识 /api/v1）
    location /tsloms/api/ {
        proxy_pass http://127.0.0.1:8093/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体静态文件（手机上传的举证/监控片段）
    # 制品化后媒体目录固定为 /opt/tsloms/shared/media（不随 release 滚动删除）
    location /tsloms/media/ {
        alias /opt/tsloms/shared/media/;
        add_header Cache-Control "public, max-age=3600";
    }

    # 健康检查
    location /tsloms/health {
        proxy_pass http://127.0.0.1:8093/api/v1/health;
        proxy_set_header Host $host;
    }
}
