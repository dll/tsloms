server {
    listen 8092;
    server_name _;

    client_max_body_size 50m;

    # 禁止绝对重定向（避免在Caddy/网关反向代理后暴露内部端口8092）
    absolute_redirect off;
    port_in_redirect off;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ------------------------------------------------------------------
    # 路径前缀 /tsloms（Vue 前端已编译为 base='/tsloms/admin/'，
    # API 请求为 /tsloms/api/v1/...）。
    # 同时保留无前缀的 /admin、/api，两种访问方式均可工作。
    # 网关（Caddy）若保留前缀则命中 /tsloms 块；若剥离前缀则命中 /admin、/api 块。
    # ------------------------------------------------------------------

    # 管理后台前缀路由（history 路由，try_files fallback 到 index.html）
    location /tsloms/admin {
        alias /opt/tsloms/packages/admin/dist;
        index index.html;
        try_files $uri $uri/ /tsloms/admin/index.html;
    }

    # /tsloms 前缀的 API 代理：剥离前缀后转发到后端（后端只认识 /api/v1）
    location /tsloms/api/ {
        proxy_pass http://127.0.0.1:8093/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /tsloms 前缀健康检查
    location /tsloms/health {
        proxy_pass http://127.0.0.1:8093/api/v1/health;
        proxy_set_header Host $host;
    }

    # 管理后台（无前缀，history 路由）
    location /admin {
        alias /opt/tsloms/packages/admin/dist;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 根路径重定向到管理后台
    location = / {
        return 302 /admin/;
    }

    # API 代理（无前缀）
    location /api {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查（无前缀）
    location /health {
        proxy_pass http://127.0.0.1:8093/api/v1/health;
        proxy_set_header Host $host;
    }
}
