server {
    listen 8092;
    server_name _;

    client_max_body_size 50m;

    # 禁止绝对重定向（避免在Caddy/网关反向代理后暴露内部端口8092）
    absolute_redirect off;
    port_in_redirect off;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ------------------------------------------------------------------
    # 统一路径前缀 /tsloms
    # 前端已编译为 base='/tsloms/admin/'，API 请求为 /tsloms/api/v1/...，
    # 401 跳转地址为 /tsloms/admin/login。故本 server 仅接受 /tsloms 前缀请求。
    # 网关（Caddy）应将 /tsloms 前缀原样转发到本机 8092（不剥离前缀）。
    # ------------------------------------------------------------------

    # 根路径重定向到管理后台
    location = / {
        return 302 /tsloms/admin/;
    }

    # 管理后台（history 路由，try_files 回退 index.html）
    location /tsloms/admin {
        alias /opt/tsloms/packages/admin/dist;
        index index.html;
        try_files $uri $uri/ /tsloms/admin/index.html;
    }

    # API 代理：剥离 /tsloms 前缀后转发到后端（后端只认识 /api/v1）
    location /tsloms/api/ {
        proxy_pass http://127.0.0.1:8093/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /tsloms/health {
        proxy_pass http://127.0.0.1:8093/api/v1/health;
        proxy_set_header Host $host;
    }
}
