server {
    # HTTP → HTTPS 重定向
    listen 80;
    listen 8092;
    server_name <你的域名>.com;

    # 重定向到 HTTPS（保留路径前缀 /tsloms）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <你的域名>.com;

    # Let's Encrypt 证书路径（certbot 生成）
    ssl_certificate     /etc/letsencrypt/live/<你的域名>.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<你的域名>.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;

    # 根路径重定向到管理后台
    location = / {
        return 302 /tsloms/admin/;
    }

    # 管理后台（history 路由，try_files 回退 index.html）
    location /tsloms/admin {
        alias /opt/tsloms/packages/admin/dist;
        index index.html;
        try_files $uri $uri/ /tsloms/admin/index.html;
    }

    # API 代理：剥离 /tsloms 前缀后转发到后端（后端只认识 /api/v1）
    location /tsloms/api/ {
        proxy_pass http://127.0.0.1:8093/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体静态文件（手机上传的举证/监控片段）
    location /tsloms/media/ {
        alias /opt/tsloms/packages/server/uploads/media/;
        add_header Cache-Control "public, max-age=3600";
    }

    # 健康检查
    location /tsloms/health {
        proxy_pass http://127.0.0.1:8093/api/v1/health;
        proxy_set_header Host $host;
    }
}
