version: '3.8'

# TSLOMS 生产环境 Docker Compose（仅基础设施：MySQL、Redis、EMQX；后端经 systemd 运行）
# 安全基线（P0-03 整改）：
#   - 所有端口仅绑定 127.0.0.1，不对公网暴露
#   - 容器内新增应用专用数据库用户 tsloms（非 root），仅授予 tsloms 库权限
#   - Redis 启用密码认证
#   - EMQX 启用认证（admin 密码、MQTT 用户由 .env 提供）；内网 Dashboard 仅本机可访问

services:
  mysql:
    image: mysql:8.0
    container_name: tsloms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置}
      MYSQL_DATABASE: tsloms
      MYSQL_USER: ${DB_USER:-tsloms}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD 未设置}
      MYSQL_CHARSET: utf8mb4
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7.0
    container_name: tsloms-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?REDIS_PASS 未设置}", "--bind", "127.0.0.1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  emqx:
    image: emqx/emqx:5.0
    container_name: tsloms-emqx
    restart: always
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD 未设置}
      EMQX_AUTHENTICATION__1__ENABLED: "true"
      # 列表式认证：为 MQTT 提供 tsloms 用户与密码
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__USERNAME: ${MQTT_USERNAME:-tsloms}
      EMQX_AUTHENTICATION__1__PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD 未设置}
    ports:
      - "127.0.0.1:1883:1883"    # MQTT TCP（仅本机）
      - "127.0.0.1:18083:18083"  # EMQX Dashboard（仅本机）
    volumes:
      - emqx_data:/opt/emqx/data

volumes:
  mysql_data:
  redis_data:
  emqx_data:
