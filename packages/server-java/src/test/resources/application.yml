# 测试数据源：H2 内存库（对齐 Go 版 InitTestDB 内存 SQLite 策略）
# ddl-auto=create-drop 等价于 Go 测试的 AutoMigrate 全量建表
spring:
  datasource:
    url: jdbc:h2:mem:tsloms_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  jackson:
    # 与主配置一致：snake_case 契约（测试 yml 覆盖整个主 yml，需重复声明）
    property-naming-strategy: SNAKE_CASE

# 测试用强密钥（jjwt 要求 HS256 ≥32 字节）
jwt:
  secret: "unit-test-secret-key-0123456789abcdef0123456789abcdef"

# 测试不连真实 broker
mqtt:
  enabled: false
