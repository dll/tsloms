# TSLOMS 后端（Java 重构版）配置
# 环境变量语义与 Go 版 internal/config 对齐；生产由 systemd EnvironmentFile 注入。

server:
  port: ${SERVER_PORT:8093}

spring:
  application:
    name: tsloms-server
  jackson:
    # 关键契约配置：Go 版所有 JSON 字段为 snake_case（json tag），Java 端全局对齐
    property-naming-strategy: SNAKE_CASE
  datasource:
    # 环境变量语义与 Go 版 internal/config 一致：DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:tsloms}?useUnicode=true&characterEncoding=utf8mb4&connectionTimeZone=local
    username: ${DB_USER:tsloms}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 生产禁用自动建表：表结构由既有 Go 版 AutoMigrate 维护（双跑期），Java 侧只读映射
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  # 运行环境：development / production / test（Go 版 APP_ENV 同名同默认）
  env: ${APP_ENV:development}

jwt:
  # JWT_SECRET：生产至少 32 位强随机（Go 版同名变量；开发默认与 Go 版一致）
  secret: ${JWT_SECRET:tsloms-secret-key}

mqtt:
  broker: ${MQTT_BROKER:tcp://127.0.0.1:1883}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  client-id: ${MQTT_CLIENT_ID:tsloms-server}
  topic-prefix: ${MQTT_TOPIC_PREFIX:trafficLight}
  enabled: ${MQTT_ENABLED:true}

emqx:
  api-url: ${EMQX_API_URL:http://127.0.0.1:18083}
  token: ${EMQX_API_TOKEN:}
  api-username: ${EMQX_API_USERNAME:}
  api-password: ${EMQX_API_PASSWORD:}
